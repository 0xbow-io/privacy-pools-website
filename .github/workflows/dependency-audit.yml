name: Dependency audit

# Fails when the production dependency tree has a high or critical advisory.
# Exceptions live in package.json under pnpm.auditConfig.ignoreGhsas and are explained in
# docs/dependency-audit.md. Add one only with a written reason.

on:
  pull_request:
  push:
    branches: [main, dev]
  schedule:
    # New advisories land without any change in this repo, so re-check weekly.
    - cron: '17 6 * * 1'

permissions:
  contents: read

jobs:
  audit:
    name: pnpm audit (production, high and critical)
    runs-on: ubuntu-latest

    steps:
      # Actions are pinned to a commit so a moved tag cannot change what a security gate runs.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Install Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.22.1'

      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high
