name: Dependency audit

# Fails when the production dependency tree has a high or critical advisory.
# Exceptions live in package.json under pnpm.auditConfig.ignoreGhsas and are explained in
# docs/dependency-audit.md. Add one only with a written reason.

on:
  pull_request:
  push:
    branches: [main, dev]
  schedule:
    # New advisories land without any change in this repo, so re-check weekly.
    - cron: '17 6 * * 1'

permissions:
  contents: read

jobs:
  audit:
    name: pnpm audit (production, high and critical)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'

      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high
